<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Besley";
        src: url("../node_modules/@fontsource-variable/besley/files/besley-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 400 900;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("../node_modules/@fontsource-variable/public-sans/files/public-sans-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Plex";
        src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2")
          format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #f4f1ea;
        color: #1c1f24;
      }
      .wrap {
        padding: 88px 96px;
        box-sizing: border-box;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .kicker {
        font: 400 22px "Plex";
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #4e535a;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .kicker img {
        width: 44px;
        height: 44px;
      }
      h1 {
        font: 600 112px/1 "Besley";
        margin: 40px 0 0;
      }
      .rule {
        width: 120px;
        height: 5px;
        background: #a8792b;
        margin: 34px 0 30px;
      }
      p {
        font: 400 32px/1.35 "Public Sans";
        color: #4e535a;
        margin: 0;
        max-width: 940px;
      }
      .foot {
        margin-top: auto;
        font: 400 24px "Plex";
        color: #3f6f66;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="kicker"><img src="../src/assets/mark.svg" alt="" />Assay, by Garkuwa Labs</div>
      <h1>Assay docs</h1>
      <div class="rule"></div>
      <p>
        Open proof of reserves and circuit breakers for real-world assets and stablecoins on
        Stellar.
      </p>
      <div class="foot">docs.assay.wtf · Facts, not ratings.</div>
    </div>
  </body>
</html>
