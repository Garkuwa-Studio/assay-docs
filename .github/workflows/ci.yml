name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      # Fails on any broken internal link or heading.
      - run: pnpm build
      - run: pnpm check-dist
      - name: Every linked transaction succeeded on Stellar
        run: pnpm check-chain
      - name: Lighthouse (95+ on every category)
        run: pnpm lighthouse
      - name: Keep Lighthouse reports if it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
